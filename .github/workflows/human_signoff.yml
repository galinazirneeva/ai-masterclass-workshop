name: Human sign-off

# Separate from CI on purpose: adding the "human-approved" label re-runs only this check,
# so the Gate 2 and Gate 3 results in CI stay green on the PR.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  methodology_critical:
    name: Methodology-critical review gate
    runs-on: ubuntu-latest

    steps:
      - name: Detect changed methodology-critical files
        id: detect
        uses: actions/github-script@v7
        with:
          script: |
            const critical = [
              'pipeline/src/baseline.py',
              'pipeline/src/scoring.py',
              'pipeline/src/alert_ranking.py',
              'pipeline/src/llm_interpretation.py',
            ];

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const changed = critical.filter((file) => files.some((f) => f.filename === file));
            core.setOutput('changed', changed.length > 0 ? 'true' : 'false');
            core.setOutput('files', JSON.stringify(changed));

      - name: Add methodology_critical label to PR
        if: steps.detect.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'methodology_critical';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label,
                  color: 'd73a4a',
                  description: 'Methodology-critical files changed; human review required before merge',
                });
              } else {
                throw error;
              }
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: [label],
            });

      - name: Require human sign-off before merge
        if: steps.detect.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            // GitHub does not let a PR author approve their own PR,
            // so human sign-off = the "human-approved" label added by a person (not a bot).
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const events = await github.paginate(github.rest.issues.listEvents, { owner, repo, issue_number });
            const labels = (await github.rest.issues.listLabelsOnIssue({ owner, repo, issue_number })).data.map(l => l.name);
            const byHuman = events.some(e => e.event === 'labeled' && e.label && e.label.name === 'human-approved'
              && e.actor && e.actor.type !== 'Bot');
            if (!(labels.includes('human-approved') && byHuman)) {
              core.setFailed('Methodology-critical files changed. Merge is blocked until a human adds the "human-approved" label.');
            } else {
              core.info('Human sign-off on record: ' + JSON.stringify(labels));
            }
