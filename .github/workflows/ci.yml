name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Gate 2 - anomaly pipeline tests
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate DeepSeek test file
        run: python pipeline/scripts/generate_tests_deepseek.py

      - name: Run pipeline anomaly tests
        run: python pipeline/tests/test_anomaly.py

  gate3_review:
    name: Gate 3 - Sonnet methodology review
    runs-on: ubuntu-latest
    needs: test

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Gate 3 Sonnet review
        run: python pipeline/review/sonnet_review.py

      - name: Upload last review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: last_review.json
          path: pipeline/review/last_review.json
          if-no-files-found: warn

  methodology_critical:
    name: Methodology-critical review gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Detect changed methodology-critical files
        id: detect
        uses: actions/github-script@v7
        with:
          script: |
            const critical = [
              'pipeline/src/baseline.py',
              'pipeline/src/scoring.py',
              'pipeline/src/alert_ranking.py',
              'pipeline/src/llm_interpretation.py',
            ];

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const changed = critical.filter((file) => files.some((f) => f.filename === file));
            core.setOutput('changed', changed.length > 0 ? 'true' : 'false');
            core.setOutput('files', JSON.stringify(changed));

      - name: Add methodology_critical label to PR
        if: steps.detect.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'methodology_critical';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label,
                  color: 'd73a4a',
                  description: 'Methodology-critical files changed; human review required before merge',
                });
              } else {
                throw error;
              }
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: [label],
            });

      - name: Require human review before merge
        if: steps.detect.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          token = os.environ['GITHUB_TOKEN']
          pr_number = os.environ['PR_NUMBER']
          repo = os.environ['REPO']
          owner, repo_name = repo.split('/', 1)

          url = f'https://api.github.com/repos/{owner}/{repo_name}/pulls/{pr_number}/reviews'
          req = urllib.request.Request(
              url,
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )

          with urllib.request.urlopen(req) as response:
              reviews = json.load(response)

          approved = any(
              review.get('state') == 'APPROVED' and not str(review.get('user', {}).get('login', '')).endswith('[bot]')
              for review in reviews
          )

          if not approved:
              print('Methodology-critical changes detected. A human review approval is required before merge.')
              sys.exit(1)

          print('Methodology-critical PR has a human approval on record.')
          PY
