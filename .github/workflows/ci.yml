name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Gate 2 - anomaly pipeline tests
    runs-on: ubuntu-latest
    if: github.event.action != 'labeled' && github.event.action != 'edited'
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gate 2 — stable test suite (blocking)
        run: python -m pytest pipeline/tests -q --ignore=pipeline/tests/exploratory_deepseek.py

      - name: DeepSeek exploratory tests (advisory)
        continue-on-error: true
        env:
          DEEPSEEK_TESTS_OUT: pipeline/tests/exploratory_deepseek.py
        run: |
          python pipeline/scripts/generate_tests_deepseek.py
          python -m pytest pipeline/tests/exploratory_deepseek.py -q

  gate3_review:
    name: Gate 3 - Sonnet methodology review
    runs-on: ubuntu-latest
    needs: test
    if: github.event.action != 'labeled' && github.event.action != 'edited'

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Gate 3 Sonnet review
        run: python pipeline/review/sonnet_review.py

      - name: Upload last review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: last_review.json
          path: pipeline/review/last_review.json
          if-no-files-found: warn

      - name: Post Gate 3 verdict to the PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'pipeline/review/last_review.json';
            if (!fs.existsSync(path)) { core.warning('No Gate 3 review file'); return; }
            const r = JSON.parse(fs.readFileSync(path, 'utf8'));
            const list = (title, items) => items && items.length
              ? `### ${title}\n` + items.map(i => `- ${typeof i === 'string' ? i : JSON.stringify(i)}`).join('\n') + '\n\n'
              : '';
            const icon = r.verdict === 'PASS' ? '✅' : '❌';
            const body = `## ${icon} Gate 3 — Sonnet methodology review: **${r.verdict}**\n\n`
              + list('Silent failure risks', r.silent_failure_risks)
              + list('Needs human judgment', r.human_judgment_required)
              + list('What tests do not cover', r.test_coverage_gaps)
              + list('Threshold owners', r.threshold_owners)
              + `_Gate 3 advises. A human decides._`;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request.number, body });

  methodology_critical:
    name: Methodology-critical review gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Detect changed methodology-critical files
        id: detect
        uses: actions/github-script@v7
        with:
          script: |
            const critical = [
              'pipeline/src/baseline.py',
              'pipeline/src/scoring.py',
              'pipeline/src/alert_ranking.py',
              'pipeline/src/llm_interpretation.py',
            ];

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const changed = critical.filter((file) => files.some((f) => f.filename === file));
            core.setOutput('changed', changed.length > 0 ? 'true' : 'false');
            core.setOutput('files', JSON.stringify(changed));

      - name: Add methodology_critical label to PR
        if: steps.detect.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'methodology_critical';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label,
                  color: 'd73a4a',
                  description: 'Methodology-critical files changed; human review required before merge',
                });
              } else {
                throw error;
              }
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: [label],
            });

      - name: Require human sign-off before merge
        if: steps.detect.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            // GitHub does not let a PR author approve their own PR,
            // so human sign-off = the "human-approved" label added by a person (not a bot).
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const events = await github.paginate(github.rest.issues.listEvents, { owner, repo, issue_number });
            const labels = (await github.rest.issues.listLabelsOnIssue({ owner, repo, issue_number })).data.map(l => l.name);
            const byHuman = events.some(e => e.event === 'labeled' && e.label && e.label.name === 'human-approved'
              && e.actor && e.actor.type !== 'Bot');
            if (!(labels.includes('human-approved') && byHuman)) {
              core.setFailed('Methodology-critical files changed. Merge is blocked until a human adds the "human-approved" label.');
            } else {
              core.info('Human sign-off on record: ' + JSON.stringify(labels));
            }
